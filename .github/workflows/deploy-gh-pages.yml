name: Deploy Cryo Lab Tools to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --base-href /cryo-build-lab-tools/

      - name: Prepare GitHub Pages output
        run: |
          New-Item -ItemType Directory -Force -Path docs
          Copy-Item -Path "dist\cryo-build-lab-tools\*" -Destination "docs\" -Recurse -Force
          New-Item -Path "docs\.nojekyll" -ItemType File -Force
          Copy-Item -Path "docs\index.html" -Destination "docs\404.html" -Force
        shell: powershell

      - name: Verify build output
        run: |
          Write-Host "Checking docs directory..."
          Get-ChildItem -Path docs -Recurse | Select-Object -First 10
          Write-Host "`n.nojekyll exists:"
          Test-Path "docs\.nojekyll"
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
